name: build-android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar www (web assets)
        run: |
          mkdir www
          cp index.html style.css app.js network.js sw.js manifest.json www/
          cp -r vendor www/vendor
          cp -r sounds www/sounds
          cp -r icons www/icons

      - name: Instalar dependências e sincronizar
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Bluetooth permissions no AndroidManifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q BLUETOOTH_SCAN $M || sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />#' $M

      - name: Build APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: silva-xvi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
